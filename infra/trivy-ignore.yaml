# Excepciones del escaneo de imágenes (infra/scripts/scan-images.sh, CI). Formato YAML de Trivy (--ignorefile).
# Regla: solo se ignora lo que NO tiene corrección a nuestro alcance, acotado al archivo afectado y con vencimiento
# (expired_at): al vencer, el CI vuelve a fallar y hay que revisar de nuevo. Cómo actualizar: docs/VERSIONES.md.
#
# restic 0.19.1 (usr/local/bin/restic, imagen de backup) es la última versión publicada (revisado el 23/10/2026) y
# está compilado con Go 1.26.4 y dependencias con avisos HIGH. No hay un binario oficial corregido. Exposición:
# restic es un cliente de corta vida (no escucha en la red), cifra y autentica los datos antes de enviarlos, no usa
# los backends afectados por gRPC (GCS) ni SSH (sftp no se usa), y solo habla con el repositorio local y el externo
# que elige el propietario. Riesgo residual a vigilar: CVE-2026-111943 (crypto/x509) podría permitir un ataque de
# intermediario contra el repositorio externo por HTTPS; los datos siguen cifrados y autenticados por restic, pero
# credenciales enviadas en claro dentro del TLS (p. ej. usuario/contraseña de rest-server) quedarían expuestas.
# Cuando salga restic ≥ 0.19.2 (o 0.20): actualizar RESTIC_IMAGE en infra/docker/backup.Dockerfile y borrar esto.
