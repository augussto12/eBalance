# Overlay SOLO para pruebas locales: simula el Nginx del host con TLS (certificado autofirmado para localhost)
# usando la MISMA plantilla infra/nginx/finanzas.conf. No usar en producción.
services:
  edge:
    image: nginx:1.30.6-alpine3.24
    volumes:
      - ./infra/e2e/rendered/finanzas.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/alvarez-proxy.conf:/etc/nginx/snippets/alvarez-proxy.conf:ro
      - ./infra/e2e/rendered/certs:/etc/letsencrypt/live/localhost:ro
    ports: ["127.0.0.1:8443:443"]
    depends_on: [web]
    networks:
      frontend: { ipv4_address: 172.30.57.20 }
