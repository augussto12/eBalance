# Álvarez Finanzas — sitio para el Nginx del HOST (no reemplaza /etc/nginx/nginx.conf).
# Instalar con infra/scripts/install-nginx-site.sh, que reemplaza los placeholders:
#   finanzas.TU-DOMINIO  → nombre público (dominio, nombre tipo 1-2-3-4.sslip.io o IP)
#   CERT-DIR             → directorio del certificado (fullchain.pem / privkey.pem)
#   127.0.0.1:8088       → WEB_BIND de .env (Compose publica «web» SOLO en loopback)
# Se instala como zz-alvarez-finanzas.conf: al cargarse último nunca pasa a ser el sitio por defecto de otros proyectos.
# Este archivo se incluye dentro del bloque http {} (sites-enabled / conf.d), por eso puede definir zonas y formatos.

# Logs mínimos: sin query string (las búsquedas ?q=… nunca quedan registradas), sin User-Agent, Referer ni cookies,
# e IP reducida: IPv4 a /24 (x.y.z.0) e IPv6 a sus primeros bloques (/48, o /16 si viene abreviada). Lo que no se
# reconoce se registra como «-», nunca completo.
map $remote_addr $alvarez_ip_min {
    ~^(?<p>\d+\.\d+\.\d+)\.\d+$                                   $p.0;
    ~^::ffff:(?<p>\d+\.\d+\.\d+)\.\d+$                            $p.0;
    "~*^(?<p>[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}):"        $p::;
    "~*^(?<p>[0-9a-f]{1,4}):"                                   $p::;
    default                                                     -;
}
# Ruta pedida tal como llegó (antes del fallback del SPA), sin la query string.
map $request_uri $alvarez_path {
    "~^(?<p>[^?]*)"                                             $p;
}
log_format alvarez_min '$alvarez_ip_min [$time_iso8601] "$request_method $alvarez_path" $status $body_bytes_sent $request_time';
limit_req_zone $binary_remote_addr zone=alvarez_auth:10m rate=30r/m;

upstream alvarez_finanzas_web {
    server 127.0.0.1:8088;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name finanzas.TU-DOMINIO;
    # También el :80: si no, las redirecciones quedarían en el log por defecto del host (petición completa e IP).
    access_log /var/log/nginx/alvarez-finanzas.access.log alvarez_min;
    error_log  /var/log/nginx/alvarez-finanzas.error.log warn;
    location /.well-known/acme-challenge/ { root /var/www/certbot; default_type text/plain; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name finanzas.TU-DOMINIO;
    server_tokens off;

    # Solo el nombre propio de la app (evita servirla bajo Host ajenos si este bloque quedara como default).
    if ($host != "finanzas.TU-DOMINIO") { return 421; }

    ssl_certificate     CERT-DIR/fullchain.pem;
    ssl_certificate_key CERT-DIR/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:alvarez_ssl:10m;
    ssl_session_tickets off;

    # HSTS: habilitar SOLO después de validar HTTPS en el dominio (infra/scripts/preflight.sh lo verifica).
    # Sin includeSubDomains ni preload hasta evaluar todos los subdominios del dominio.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # Logs mínimos (formato alvarez_min, arriba): sin query string, sin cookies ni cuerpos, IP reducida.
    # El error_log de Nginx no tiene formato configurable: ante errores de upstream incluye la petición y la IP del cliente.
    access_log /var/log/nginx/alvarez-finanzas.access.log alvarez_min;
    error_log  /var/log/nginx/alvarez-finanzas.error.log warn;

    client_max_body_size 6m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    location = /api/v1/auth/login {
        limit_req zone=alvarez_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://alvarez_finanzas_web;
        include /etc/nginx/snippets/alvarez-proxy.conf;
    }

    location / {
        proxy_pass http://alvarez_finanzas_web;
        include /etc/nginx/snippets/alvarez-proxy.conf;
    }
}
