# Nginx interno (contenedor «web»): sirve el SPA y reenvía /api a la API privada (red interna de Compose).
# TLS lo termina el Nginx del host (infra/nginx/finanzas.conf), que reenvía a 127.0.0.1:${WEB_PORT}.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # IP real: solo se confía en el proxy de borde dentro de la subred fija de Compose (gateway/host o «edge»).
    set_real_ip_from 172.30.57.0/24;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    client_max_body_size 64k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # API: nunca cae en el fallback del SPA; los errores de la API se devuelven tal cual (JSON).
    location /api/ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://api:8080;
        # La API agrega sus propias cabeceras: se ocultan para no duplicarlas con las de Nginx.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Un único valor: la IP real ya validada. La API confía solo en este contenedor (KnownProxies).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_intercept_errors off;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
        proxy_buffering on;
    }

    # Única ruta que acepta archivos (vista previa de importación, máx. 5 MiB en la API).
    location = /api/v1/imports/preview {
        include /etc/nginx/security-headers.conf;
        client_max_body_size 6m;
        proxy_pass http://api:8080;
        # La API agrega sus propias cabeceras: se ocultan para no duplicarlas con las de Nginx.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location = /api {
        return 404;
    }

    # Assets versionados (hash en el nombre): caché larga.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /licenses/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # SPA: index sin caché persistente.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
