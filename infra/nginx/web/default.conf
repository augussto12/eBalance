# Nginx interno (contenedor «web»): sirve el SPA y reenvía /api a la API privada (red interna de Compose).
# TLS lo termina el Nginx del host (infra/nginx/finanzas.conf), que reenvía a 127.0.0.1:${WEB_PORT}.
# Este archivo se incluye dentro del bloque http {} de la imagen (conf.d), por eso puede definir map y log_format.

# Logs mínimos: sin query string (las búsquedas ?q=… nunca quedan registradas), sin User-Agent, Referer ni cookies,
# e IP reducida: IPv4 a /24 (x.y.z.0) e IPv6 a sus primeros bloques (/48, o /16 si viene abreviada). Lo que no se
# reconoce se registra como «-», nunca completo.
map $remote_addr $alvarez_ip_min {
    ~^(?<p>\d+\.\d+\.\d+)\.\d+$                                   $p.0;
    ~^::ffff:(?<p>\d+\.\d+\.\d+)\.\d+$                            $p.0;
    "~*^(?<p>[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}):"        $p::;
    "~*^(?<p>[0-9a-f]{1,4}):"                                   $p::;
    default                                                     -;
}
# Ruta pedida tal como llegó (antes del fallback del SPA), sin la query string.
map $request_uri $alvarez_path {
    "~^(?<p>[^?]*)"                                             $p;
}
log_format alvarez_min '$alvarez_ip_min [$time_iso8601] "$request_method $alvarez_path" $status $body_bytes_sent $request_time';

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    # Reemplaza el formato «main» de la imagen (petición completa con query string, IP, User-Agent y X-Forwarded-For).
    access_log /var/log/nginx/access.log alvarez_min;

    # IP real: solo se confía en el proxy de borde dentro de la subred fija de Compose (gateway/host o «edge»).
    set_real_ip_from 172.30.57.0/24;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    client_max_body_size 64k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # API: nunca cae en el fallback del SPA; los errores de la API se devuelven tal cual (JSON).
    location /api/ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://api:8080;
        # La API agrega sus propias cabeceras: se ocultan para no duplicarlas con las de Nginx.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Un único valor: la IP real ya validada. La API confía solo en este contenedor (KnownProxies).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_intercept_errors off;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
        proxy_buffering on;
    }

    # Única ruta que acepta archivos (vista previa de importación, máx. 5 MiB en la API).
    location = /api/v1/imports/preview {
        include /etc/nginx/security-headers.conf;
        client_max_body_size 6m;
        proxy_pass http://api:8080;
        # La API agrega sus propias cabeceras: se ocultan para no duplicarlas con las de Nginx.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location = /api {
        return 404;
    }

    # Assets versionados (hash en el nombre): caché larga.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /licenses/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # SPA: index sin caché persistente.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
